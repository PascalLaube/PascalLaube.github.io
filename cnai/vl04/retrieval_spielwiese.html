<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retrieval-Spielwiese · VL 04 · Cloud-native AI</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--lila:#6d28d9;--dunkel:#2e1065;--hell:#f5f3ff;--rand:#ddd6fe;--orange:#e65100;--gruen:#15803d;--grau:#64748b;--text:#1a2733}
  html,body{height:100%}
  body{font-family:'Segoe UI',Arial,sans-serif;color:var(--text);background:#fff;font-size:15px;line-height:1.4}
  .modus{display:none;height:100%;padding:10px 14px;flex-direction:column;gap:8px}
  .modus.an{display:flex}
  .zeile{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{font:inherit;font-size:13px;border:1px solid var(--rand);background:var(--hell);color:var(--dunkel);border-radius:999px;padding:3px 10px;cursor:pointer}
  button:hover{border-color:var(--lila)}
  button.aktiv{background:var(--lila);color:#fff;border-color:var(--lila)}
  button.umschrieben{border-color:#fdba74;background:#fff7ed}
  button.kennung{border-color:#86efac;background:#f0fdf4}
  button.fehlt{border-color:#cbd5e1;background:#f8fafc}
  button.aktiv{background:var(--lila)!important;color:#fff!important;border-color:var(--lila)!important}
  .legende button{font-size:11px;padding:1px 7px;cursor:default}
  input[type=text]{font:inherit;flex:1;min-width:260px;padding:6px 10px;border:2px solid var(--rand);border-radius:8px}
  input[type=text]:focus{outline:none;border-color:var(--lila)}
  .frage{font-size:18px;font-weight:700;color:var(--dunkel)}
  .spalten{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0}
  .spalte{border:2px solid var(--rand);border-radius:10px;padding:8px 10px;overflow:auto;min-height:0}
  .spalte h3{font-size:15px;color:var(--lila);margin-bottom:2px}
  .spalte h3 button{font-size:11px;padding:1px 8px}
  .spalte.zeichen h3{color:var(--orange)}
  .spalte .unter{font-size:12px;color:var(--grau);margin-bottom:6px}
  .treffer{border-radius:8px;padding:5px 8px;margin:5px 0;background:#f8fafc;border:1px solid #e2e8f0;font-size:13px}
  .treffer.richtig{background:#f0fdf4;border-color:#4ade80}
  .treffer .kopf{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:13px}
  .treffer .datei{font-family:Consolas,monospace}
  .treffer .text{color:#334155;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .balken{height:6px;border-radius:3px;background:var(--lila);margin-top:3px}
  .zeichen .balken{background:var(--orange)}
  mark{background:#fed7aa;border-radius:2px;padding:0 1px}
  .leer{color:var(--grau);font-style:italic;padding:8px 0}
  .soll{font-size:12px;color:var(--grau)}
  .soll b{color:var(--gruen)}
  .legende{font-size:12px;color:var(--grau)}
  /* Karte */
  .karte{display:grid;grid-template-columns:1fr 300px;gap:12px;flex:1;min-height:0}
  svg.punkte{width:100%;height:100%;border:2px solid var(--rand);border-radius:10px;background:#fcfbff}
  .info{border:2px solid var(--rand);border-radius:10px;padding:8px 10px;overflow:auto;font-size:13px}
  .info h3{font-size:14px;color:var(--lila);margin-bottom:4px}
  /* Chunking */
  .regler{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:14px}
  .regler label{display:flex;gap:6px;align-items:center}
  .regler output{font-weight:700;color:var(--lila);min-width:3.2em;display:inline-block}
  .chunks{flex:1;overflow:auto;border:2px solid var(--rand);border-radius:10px;padding:10px;font-size:14px;line-height:1.75;white-space:pre-wrap;font-family:Consolas,monospace}
  .ch{border-radius:4px;padding:1px 0}
  .ch0{background:#ede9fe}.ch1{background:#fef3c7}.ch2{background:#dcfce7}.ch3{background:#e0f2fe}.ch4{background:#fce7f3}
  .ueberlapp{background:#c4b5fd !important}
  .fakt{outline:2px solid var(--orange);outline-offset:1px;border-radius:2px}
  .status{font-size:14px;padding:6px 10px;border-radius:8px}
  .status.gut{background:#f0fdf4;color:#14532d}
  .status.schlecht{background:#fff7ed;color:#9a3412}
</style>
</head>
<body>
<nav id="tabs" style="display:none;gap:6px;padding:8px 14px 0">
  <button data-m="suche">Suchen: grep und Embeddings</button>
  <button data-m="karte">Karte nach Bedeutung</button>
  <button data-m="chunking">Chunking</button>
</nav>

<!-- ======================= SUCHE ======================= -->
<section class="modus" id="m-suche">
  <div class="zeile" id="vorlagen"></div>
  <div class="zeile">
    <input type="text" id="eingabe" placeholder="Eigene Frage tippen und Enter …">
    <span class="legende">Farbe der Fragen: <button class="umschrieben" disabled>umschrieben</button> <button class="kennung" disabled>exakte Kennung</button> <button class="fehlt" disabled>steht nirgends</button> <button disabled>direkt</button></span>
  </div>
  <div class="zeile"><span class="frage" id="frage-text"></span><span class="soll" id="soll"></span></div>
  <div class="spalten">
    <div class="spalte zeichen">
      <h3>Suche nach Zeichen · <span id="grep-titel">grep</span> <span style="float:right"><button id="b-grep" class="aktiv">Treffer zählen</button> <button id="b-bm25">BM25</button></span></h3>
      <div class="unter" id="grep-woerter"></div>
      <div id="grep-liste"></div>
    </div>
    <div class="spalte">
      <h3>Suche nach Bedeutung · Embeddings</h3>
      <div class="unter" id="emb-info"></div>
      <div id="emb-liste"></div>
    </div>
  </div>
</section>

<!-- ======================= KARTE ======================= -->
<section class="modus" id="m-karte">
  <div class="zeile" id="vorlagen-karte"></div>
  <div class="karte">
    <svg class="punkte" id="punkte" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="info" id="karte-info"></div>
  </div>
</section>

<!-- ======================= CHUNKING ======================= -->
<section class="modus" id="m-chunking">
  <div class="regler">
    <label>Abschnittsgröße <input type="range" id="groesse" min="80" max="700" step="10" value="160"><output id="groesse-w"></output> Zeichen</label>
    <label>Überlappung <input type="range" id="overlap" min="0" max="150" step="10" value="0"><output id="overlap-w"></output> Zeichen</label>
    <button id="nach-ueberschrift">an Überschriften trennen</button>
  </div>
  <div class="status" id="chunk-status"></div>
  <div class="chunks" id="chunks"></div>
</section>

<script>
const DATEN = {"modell": "granite-embedding:278m", "abschnitte": [{"datei": "abschlussarbeit.md", "text": "Bachelorarbeit\nDie Bachelorarbeit meldet ihr mit dem Formular PA-12 beim Prüfungsamt an,\nunterschrieben von der betreuenden Professorin oder dem betreuenden Professor.\nVoraussetzung sind mindestens 150 ECTS.", "xy": [0.4966, 0.792]}, {"datei": "abschlussarbeit.md", "text": "Bachelorarbeit\nDie Bearbeitungszeit beträgt drei Monate. Auf begründeten Antrag kann sie\neinmal um bis zu sechs Wochen verlängert werden. Abgegeben wird digital als\nPDF über das Prüfungsportal, zusammen mit der unterschriebenen Erklärung zur\nselbstständigen Anfertigung und zur Nutzung von KI-Werkzeugen.", "xy": [0.4771, 0.7726]}, {"datei": "auslandssemester.md", "text": "Auslandssemester\nDas International Office in Gebäude A, Raum A-301, berät zu Partnerhochschulen,\nErasmus-Förderung und Anerkennung von Leistungen. Die Bewerbung für ein\nAuslandssemester im folgenden Studienjahr läuft bis zum 15. Januar.", "xy": [0.667, 0.3996]}, {"datei": "auslandssemester.md", "text": "Auslandssemester\nVor der Abreise schließt ihr ein Learning Agreement mit eurer\nStudiengangsleitung ab. Darin steht, welche Module im Ausland euch zu Hause\nangerechnet werden. Ohne Learning Agreement gibt es keine Garantie auf\nAnerkennung.", "xy": [0.6354, 0.4025]}, {"datei": "beratung.md", "text": "Beratung und Unterstützung\n## Studienberatung\nDie Zentrale Studienberatung hilft bei Fragen zur Studienwahl, bei Zweifeln\nam Studium und bei Problemen mit der Studienorganisation. Offene Sprechstunde\nDienstag und Donnerstag 10 bis 12 Uhr, Raum A-201.", "xy": [0.8287, 0.4607]}, {"datei": "beratung.md", "text": "Beratung und Unterstützung\n## Psychosoziale Beratung\nBei Prüfungsangst, Überlastung, persönlichen Krisen oder wenn euch alles zu\nviel wird, bietet die Psychosoziale Beratung des Studierendenwerks kostenlose\nund vertrauliche Gespräche an. Termine gibt es meist innerhalb einer Woche\nüber das Online-Formular. In akuten Notlagen ist die Telefonseelsorge rund um\ndie Uhr unter 0800 111 0 111 erreichbar.", "xy": [0.8533, 0.4491]}, {"datei": "bibliothek.md", "text": "Bibliothek\n## Öffnungszeiten\nDie Bibliothek im Gebäude L hat Montag bis Freitag von 8 bis 22 Uhr geöffnet,\nam Samstag von 9 bis 16 Uhr. An Sonn- und Feiertagen bleibt sie geschlossen.\nIn der vorlesungsfreien Zeit schließt sie werktags schon um 18 Uhr.", "xy": [0.0562, 0.3034]}, {"datei": "bibliothek.md", "text": "Bibliothek\n## Ausleihe und Verlängerung\nAusleihen könnt ihr mit der Campuskarte an den Selbstverbuchern im Eingang.\nDie Leihfrist beträgt vier Wochen. Im Bibliothekskonto lässt sich ein Medium\nbis zu dreimal online verlängern, solange niemand es vorgemerkt hat.", "xy": [0.1102, 0.2387]}, {"datei": "bibliothek.md", "text": "Bibliothek\n## Mahngebühren\nWer ein Medium zu spät zurückgibt, zahlt 50 Cent pro Tag und Medium.\nAb 10 Euro offener Gebühren ist das Konto für weitere Ausleihen gesperrt.", "xy": [0.0817, 0.2284]}, {"datei": "bibliothek.md", "text": "Bibliothek\n## Gruppenräume\nIm ersten Stock gibt es sechs Gruppenräume (L-104 bis L-109) für zwei bis\nacht Personen. Sie werden über das Buchungsportal für höchstens drei Stunden\nam Stück reserviert.", "xy": [0.083, 0.3439]}, {"datei": "campuskarte.md", "text": "Campuskarte\nDie Campuskarte ist euer Studierendenausweis, eure Bibliothekskarte und eure\nGeldbörse für Mensa und Drucker. Sie gilt nur mit aktuellem\nSemesteraufdruck, den ihr an den Validierungsautomaten in Gebäude A erneuert.", "xy": [0.4412, 0.3146]}, {"datei": "campuskarte.md", "text": "Campuskarte\n## Verlust\nIst die Karte weg, lasst sie sofort im Studierendenportal sperren, damit\nniemand euer Guthaben ausgibt. Eine Ersatzkarte kostet 15 Euro und liegt nach\nzwei Werktagen im Studierendensekretariat, Raum A-010, zur Abholung bereit.\nRestguthaben wird auf die neue Karte übertragen.", "xy": [0.4765, 0.3043]}, {"datei": "drucken.md", "text": "Drucken und Kopieren\nDrucker stehen in der Bibliothek und im Kopierraum F-012 im Erdgeschoss von\nGebäude F. Gedruckt wird mit der Campuskarte. Eine Seite schwarzweiß kostet\n5 Cent, in Farbe 20 Cent. Scannen ist kostenlos und landet als PDF in eurem\nHochschulpostfach.", "xy": [0.2078, 0.2348]}, {"datei": "drucken.md", "text": "Drucken und Kopieren\nDruckaufträge schickt ihr über das Portal print.campus an die Warteschlange\nund gebt sie dann am Gerät mit der Karte frei. Nicht abgeholte Aufträge\nwerden nach 24 Stunden gelöscht.", "xy": [0.1927, 0.2052]}, {"datei": "fundbuero.md", "text": "Fundsachen\nLiegen gebliebene Gegenstände wie Schlüssel, Brillen, Jacken oder Ladekabel\nbringt der Hausdienst zur Pforte in Gebäude A. Dort könnt ihr sie Montag bis\nFreitag von 7 bis 18 Uhr abholen. Nach drei Monaten gehen nicht abgeholte\nSachen an das städtische Fundbüro. Wertsachen wie Handys und Geldbörsen gibt\ndie Pforte sofort an das städtische Fundbüro weiter.", "xy": [0.1427, 0.1698]}, {"datei": "lernraeume.md", "text": "Lernplätze außerhalb der Bibliothek\nDie Lernzone im Erdgeschoss von Gebäude O ist rund um die Uhr geöffnet, auch\nam Wochenende. Nach 20 Uhr öffnet die Tür nur mit der Campuskarte.\nEs gibt 60 Plätze mit Steckdosen, eine Teeküche und zwei Telefonboxen für\nVideocalls. Reservieren kann man dort nichts, wer zuerst kommt, lernt zuerst.", "xy": [0.2361, 0.4311]}, {"datei": "lernraeume.md", "text": "Lernplätze außerhalb der Bibliothek\nTagsüber sind außerdem freie Seminarräume nutzbar, solange dort keine\nVeranstaltung stattfindet. Welche Räume frei sind, zeigt die Raumbelegung im\nStudierendenportal.", "xy": [0.2092, 0.4408]}, {"datei": "mensa.md", "text": "Mensa\n## Öffnungszeiten\nDie Mensa im Gebäude M gibt Essen Montag bis Freitag von 11:15 bis 14:00 Uhr\naus. Die Cafeteria daneben öffnet schon um 7:45 Uhr und schließt um 16 Uhr.", "xy": [0.4902, 0.0741]}, {"datei": "mensa.md", "text": "Mensa\n## Angebot\nJeden Tag gibt es drei Hauptgerichte, davon mindestens eines vegan.\nAllergene stehen auf dem Speiseplan online und an der Ausgabe.", "xy": [0.4999, 0.0343]}, {"datei": "mensa.md", "text": "Mensa\n## Preise und Bezahlung\nStudierende zahlen 3,40 Euro für ein Hauptgericht, Beschäftigte 5,20 Euro,\nGäste 7,50 Euro. Bezahlt wird nur mit der Campuskarte oder per Girocard,\nBargeld nimmt die Kasse nicht an. Guthaben ladet ihr am Automaten im Foyer auf.", "xy": [0.4842, 0.1712]}, {"datei": "nachteilsausgleich.md", "text": "Nachteilsausgleich\nStudierende mit einer Behinderung oder einer chronischen Erkrankung können\nfür Prüfungen einen Nachteilsausgleich beantragen. Möglich sind zum Beispiel\nmehr Bearbeitungszeit, ein eigener Raum oder Pausen.", "xy": [1.0, 0.6648]}, {"datei": "nachteilsausgleich.md", "text": "Nachteilsausgleich\nDen Antrag stellt ihr formlos beim Prüfungsausschuss, mindestens sechs Wochen\nvor der Prüfung. Bei der Begründung hilft die Beauftragte für Studierende mit\nBehinderung im Gebäude A, Raum A-115. Ein fachärztliches Gutachten ist\nin der Regel nötig.", "xy": [0.9642, 0.6576]}, {"datei": "parken.md", "text": "Parken und Anreise\nAuf dem Campus gibt es zwei Parkplätze für Kfz: P1 hinter Gebäude A und das\nParkhaus P2 an der Brauneggerstraße. Für beide braucht ihr einen\nParkausweis, der 45 Euro pro Semester kostet und im Studierendenportal\nbeantragt wird. Ohne Ausweis kostet ein Tag im Parkhaus 6 Euro.", "xy": [0.3379, 0.3095]}, {"datei": "parken.md", "text": "Parken und Anreise\nFahrradstellplätze gibt es vor jedem Gebäude, überdacht vor F und O.\nMit Bus und Bahn erreicht ihr den Campus über die Haltestelle Hochschule.", "xy": [0.3107, 0.3258]}, {"datei": "praxissemester.md", "text": "Praktisches Studiensemester\nIm fünften Semester arbeitet ihr mindestens 95 Präsenztage in einem\nUnternehmen. Den Ausbildungsvertrag schickt ihr spätestens vier Wochen vor\nBeginn an das Praktikantenamt, Raum F-201. Das Praktikantenamt prüft, ob die\nStelle zum Studiengang passt.", "xy": [0.5081, 0.6608]}, {"datei": "praxissemester.md", "text": "Praktisches Studiensemester\nAm Ende gebt ihr einen Bericht von etwa 15 Seiten und ein Zeugnis des\nUnternehmens ab. Krankheitstage über fünf Tage hinaus müssen nachgeholt werden.", "xy": [0.4889, 0.6398]}, {"datei": "pruefungsanmeldung.md", "text": "Prüfungsanmeldung\n## Anmeldezeitraum\nPrüfungen meldet ihr im Portal HISinOne an. Der Anmeldezeitraum für das\nWintersemester läuft vom 1. bis 20. November, für das Sommersemester vom\n1. bis 20. Mai. Ohne Anmeldung dürft ihr nicht an der Prüfung teilnehmen.", "xy": [0.7168, 0.7273]}, {"datei": "pruefungsanmeldung.md", "text": "Prüfungsanmeldung\n## Abmeldung\nAbmelden könnt ihr euch ohne Angabe von Gründen bis sieben Tage vor dem\nPrüfungstermin, ebenfalls in HISinOne. Danach ist eine Abmeldung nur noch\nüber einen Rücktritt mit triftigem Grund möglich (siehe Prüfungsordnung § 12).", "xy": [0.7367, 0.764]}, {"datei": "pruefungsanmeldung.md", "text": "Prüfungsanmeldung\n## Prüfungsplan\nDer Prüfungsplan erscheint spätestens vier Wochen vor Beginn des\nPrüfungszeitraums auf der Website des Prüfungsamts.", "xy": [0.6754, 0.7247]}, {"datei": "pruefungsordnung.md", "text": "Prüfungsordnung (Auszug)\n§ 9 Prüfungsformen. Prüfungen sind Klausuren, mündliche Prüfungen,\nHausarbeiten oder Projektarbeiten. Die Form steht im Modulhandbuch.", "xy": [0.8516, 0.7901]}, {"datei": "pruefungsordnung.md", "text": "Prüfungsordnung (Auszug)\n§ 12 Rücktritt. Ein Rücktritt nach Ablauf der Abmeldefrist ist nur mit\ntriftigem Grund möglich. Der Grund ist unverzüglich schriftlich nachzuweisen.", "xy": [0.7835, 0.7951]}, {"datei": "pruefungsordnung.md", "text": "Prüfungsordnung (Auszug)\n§ 14 Wiederholung. Eine nicht bestandene Prüfung darf zweimal wiederholt\nwerden. Die zweite Wiederholung ist in der Regel eine mündliche Prüfung.\nBestandene Prüfungen können nicht wiederholt werden.", "xy": [0.8246, 0.716]}, {"datei": "pruefungsordnung.md", "text": "Prüfungsordnung (Auszug)\n§ 17 Täuschung. Wer täuscht oder nicht zugelassene Hilfsmittel benutzt,\nerhält für die Prüfung die Note 5,0. In schweren Fällen kann der\nPrüfungsausschuss die Exmatrikulation beschließen.", "xy": [0.8917, 0.7624]}, {"datei": "pruefungsordnung.md", "text": "Prüfungsordnung (Auszug)\n§ 21 Nachteilsausgleich. Studierende mit Behinderung oder chronischer\nErkrankung können einen Ausgleich beantragen, etwa mehr Bearbeitungszeit.", "xy": [0.9826, 0.6977]}, {"datei": "pruefungsunfaehigkeit.md", "text": "Rücktritt aus gesundheitlichen Gründen\n## Wann gilt das?\nWer an einem Prüfungstag aus gesundheitlichen Gründen nicht antreten kann\noder eine Prüfung deshalb abbricht, gilt als prüfungsunfähig. Die Prüfung\nwird dann nicht als Fehlversuch gewertet, wenn der Grund rechtzeitig\nnachgewiesen wird.", "xy": [0.7352, 0.8407]}, {"datei": "pruefungsunfaehigkeit.md", "text": "Rücktritt aus gesundheitlichen Gründen\n## Nachweis\nNötig ist ein ärztliches Attest, das die Prüfungsunfähigkeit am Prüfungstag\nbestätigt. Eine einfache Arbeitsunfähigkeitsbescheinigung reicht nicht.\nDas Attest muss innerhalb von drei Werktagen nach dem Prüfungstermin beim\nPrüfungsamt eingehen, zusammen mit dem Formular PA-07\n„Antrag auf Anerkennung der Prüfungsunfähigkeit“.", "xy": [0.7661, 0.8408]}, {"datei": "pruefungsunfaehigkeit.md", "text": "Rücktritt aus gesundheitlichen Gründen\n## Danach\nIhr werdet automatisch zum nächsten regulären Termin angemeldet.", "xy": [0.7247, 0.8856]}, {"datei": "raeume.md", "text": "Räume und Gebäude finden\nJede Raumnummer besteht aus dem Gebäudebuchstaben, dem Stockwerk und der\nRaumnummer im Stockwerk. O-201 liegt also in Gebäude O, im zweiten\nObergeschoss, Raum 01. Das Erdgeschoss hat die Ziffer 0, F-012 liegt also im\nErdgeschoss von Gebäude F.", "xy": [0.1807, 0.3476]}, {"datei": "raeume.md", "text": "Räume und Gebäude finden\nGebäude A beherbergt Verwaltung, Studierendensekretariat und Infopoint.\nIn Gebäude L ist die Bibliothek, in M die Mensa. Die Hörsäle der Informatik\nliegen in den Gebäuden F und O. Einen Lageplan gibt es als PDF auf der\nWebsite und als Tafel an jedem Eingang.", "xy": [0.2148, 0.3394]}, {"datei": "rueckmeldung.md", "text": "Rückmeldung und Semesterbeitrag\nDamit ihr im nächsten Semester eingeschrieben bleibt, müsst ihr euch\nzurückmelden. Das geschieht durch die Überweisung des Semesterbeitrags.", "xy": [0.616, 0.539]}, {"datei": "rueckmeldung.md", "text": "Rückmeldung und Semesterbeitrag\nDer Semesterbeitrag beträgt 168,40 Euro. Er setzt sich zusammen aus dem\nVerwaltungskostenbeitrag (70 Euro), dem Beitrag für das Studierendenwerk\n(83,40 Euro) und dem Beitrag für die Verfasste Studierendenschaft (15 Euro).", "xy": [0.5855, 0.4996]}, {"datei": "rueckmeldung.md", "text": "Rückmeldung und Semesterbeitrag\nFristen: bis 15. Januar für das Sommersemester, bis 15. Juli für das\nWintersemester. Wer zu spät überweist, zahlt eine Säumnisgebühr von 25 Euro.\nWer sich gar nicht zurückmeldet, wird exmatrikuliert.", "xy": [0.6228, 0.5055]}, {"datei": "semesterticket.md", "text": "Semesterticket\nDas Deutschlandsemesterticket kostet 176,40 Euro pro Semester und ist nicht\nim Semesterbeitrag enthalten. Ihr kauft es freiwillig im Portal des\nVerkehrsverbunds. Es gilt deutschlandweit im Nahverkehr, also in Bussen,\nStraßenbahnen und Regionalzügen, aber nicht im ICE oder IC.\nDas Ticket ist digital und an die Campuskarte gebunden.", "xy": [0.5052, 0.4273]}, {"datei": "sport.md", "text": "Hochschulsport\nDer Hochschulsport bietet jedes Semester rund 50 Kurse an, von Volleyball\nüber Yoga bis Klettern. Die Anmeldung öffnet zwei Wochen nach\nVorlesungsbeginn um 12 Uhr im Sportportal und ist meist schnell voll.", "xy": [0.6783, 0.1885]}, {"datei": "sport.md", "text": "Hochschulsport\nDie meisten Kurse kosten 15 Euro pro Semester. Der Kraftraum im Untergeschoss\nvon Gebäude S ist mit einer Fitnesskarte für 30 Euro pro Semester nutzbar,\nnach einer Einweisung.", "xy": [0.6337, 0.1948]}, {"datei": "wiederholungspruefung.md", "text": "Wiederholungsprüfung\nHabt ihr eine Prüfung nicht bestanden, werdet ihr im folgenden Semester\nautomatisch zur Wiederholung angemeldet. Insgesamt habt ihr drei Versuche.\nDer dritte Versuch findet meistens mündlich statt, die Prüfenden legen den\nTermin mit euch fest. Wer auch den dritten Versuch nicht besteht, verliert\nden Prüfungsanspruch im Studiengang. Vorher lohnt sich ein Termin bei der\nStudienberatung.", "xy": [0.774, 0.6861]}, {"datei": "wlan.md", "text": "WLAN\nAuf dem ganzen Campus funkt eduroam. Ihr meldet euch mit eurer\nHochschul-Mailadresse und dem Passwort eures Hochschulkontos an.\nDie Einrichtung übernimmt am einfachsten die App geteduroam.", "xy": [0.3366, 0.1013]}, {"datei": "wlan.md", "text": "WLAN\nFür Besucherinnen und Besucher gibt es das Netz HTWG-Gast. Ein Tagesticket\ndafür bekommt man am Infopoint im Gebäude A gegen Vorlage eines Ausweises.\nBei Problemen hilft der IT-Service, Raum F-105, Telefon 07531 206-555.", "xy": [0.3578, 0.1295]}], "fragen": [{"frage": "Bis wann hat die Bibliothek am Samstag offen?", "quelle": "bibliothek.md", "typ": "direkt", "xy": [0.0334, 0.2788], "sim": [0.4879, 0.5596, 0.5304, 0.5113, 0.5555, 0.5378, 0.8665, 0.7557, 0.7565, 0.6927, 0.5405, 0.5732, 0.6218, 0.6253, 0.6426, 0.7342, 0.7019, 0.6628, 0.5606, 0.586, 0.474, 0.5442, 0.59, 0.5797, 0.5216, 0.5894, 0.5798, 0.5473, 0.5884, 0.4443, 0.4955, 0.491, 0.4527, 0.5145, 0.5439, 0.5183, 0.5215, 0.5052, 0.6239, 0.5182, 0.5259, 0.5932, 0.5324, 0.5539, 0.5231, 0.5387, 0.5342, 0.6183], "kurz": "Bibliothek Samstag"}, {"frage": "Was zahlt ein Gast in der Mensa für ein Hauptgericht?", "quelle": "mensa.md", "typ": "direkt", "xy": [0.494, 0.1426], "sim": [0.5283, 0.4814, 0.5385, 0.5748, 0.5234, 0.5355, 0.5173, 0.5809, 0.6412, 0.6014, 0.5771, 0.5836, 0.5417, 0.4908, 0.5665, 0.5507, 0.5678, 0.7182, 0.7056, 0.8515, 0.5418, 0.5869, 0.6171, 0.5538, 0.5436, 0.5448, 0.537, 0.5188, 0.4985, 0.5136, 0.5013, 0.4844, 0.5462, 0.5183, 0.5038, 0.5179, 0.4564, 0.4966, 0.594, 0.5238, 0.6242, 0.6133, 0.615, 0.4957, 0.6452, 0.4981, 0. // ---------------- Suche ----------------
const dokumente = {};
DATEN.abschnitte.forEach(a => { (dokumente[a.datei] ||= []).push(a.text); });
const volltext = Object.fromEntries(Object.entries(dokumente).map(([d, t]) => [d, t.join("\n")]));

function woerter(frage) {
  return (frage.toLowerCase().match(/[\wäöüß§-]+/g) || []).filter(w => !STOPP.has(w) && w.length > 2);
}
function esc(s) { return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function markiere(text, begriffe) {
  let html = esc(text);
  if (!begriffe.length) return html;
  const re = new RegExp("(" + begriffe.map(b => b.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return html.replace(re, "<mark>$1</mark>");
}
function grep(frage) {
  const b = woerter(frage);
  const liste = [];
  for (const [datei, text] of Object.entries(volltext)) {
    const klein = text.toLowerCase();
    let wert = 0;
    b.forEach(w => { let i = 0; while ((i = klein.indexOf(w, i)) !== -1) { wert++; i += w.length; } });
    if (wert > 0) liste.push({datei, wert, text});
  }
  liste.sort((x, y) => y.wert - x.wert);
  return {begriffe: b, liste: liste.slice(0, 4)};
}
// BM25: ganze Wörter statt Teilstrings, seltene Wörter zählen mehr (IDF), lange Dateien weniger.
const TOK = t => t.toLowerCase().match(/[\wäöüß§-]+/g) || [];
const DOK_TOK = Object.fromEntries(Object.entries(volltext).map(([d, t]) => [d, TOK(t)]));
const N = Object.keys(DOK_TOK).length;
const AVGDL = Object.values(DOK_TOK).reduce((s, t) => s + t.length, 0) / N;
function bm25(frage) {
  const b = woerter(frage), k1 = 1.2, bb = 0.75;
  const idf = w => { const n = Object.values(DOK_TOK).filter(t => t.includes(w)).length; return Math.log(1 + (N - n + 0.5) / (n + 0.5)); };
  const liste = [];
  for (const [datei, tok] of Object.entries(DOK_TOK)) {
    let wert = 0;
    b.forEach(w => { const tf = tok.filter(x => x === w).length; if (tf) wert += idf(w) * tf * (k1 + 1) / (tf + k1 * (1 - bb + bb * tok.length / AVGDL)); });
    if (wert > 0) liste.push({datei, wert, text: volltext[datei]});
  }
  liste.sort((x, y) => y.wert - x.wert);
  return {begriffe: b, liste: liste.slice(0, 4), idf: Object.fromEntries(b.map(w => [w, idf(w)]))};
}
let modusBm25 = false;

function ausschnitt(text, begriffe) {
  const zeilen = text.split("\n").filter(z => z.trim() && !z.startsWith("#"));
  const z = zeilen.find(z => begriffe.some(b => z.toLowerCase().includes(b))) || zeilen[0] || "";
  return markiere(z, begriffe);
}

let aktuell = null, letzte = null;
async function suche(frage, vorlage) {
  letzte = [frage, vorlage];
  document.getElementById("frage-text").textContent = "„" + frage + "“";
  const soll = document.getElementById("soll");
  soll.innerHTML = vorlage && vorlage.quelle ? "richtige Datei: <b>" + vorlage.quelle + "</b>" :
                   (vorlage && vorlage.typ === "fehlt" ? "steht in keinem Dokument" : "");
  const g = modusBm25 ? bm25(frage) : grep(frage);
  document.getElementById("grep-woerter").textContent = !g.begriffe.length ? "keine Suchwörter übrig" : modusBm25 ?
    "ganze Wörter, Gewicht (IDF): " + g.begriffe.map(w => w + " " + g.idf[w].toFixed(1)).join(" · ") :
    "gesucht: " + g.begriffe.map(w => '"' + w + '"').join(" ") + " · auch als Wortteil · Treffer gezählt";
  const max = Math.max(1, ...g.liste.map(t => t.wert));
  document.getElementById("grep-liste").innerHTML = g.liste.length ? g.liste.map(t => `
    <div class="treffer ${vorlage && t.datei === vorlage.quelle ? "richtig" : ""}">
      <div class="kopf"><span class="datei">${t.datei}</span><span>${modusBm25 ? t.wert.toFixed(2) : t.wert + " Treffer"}</span></div>
      <div class="balken" style="width:${100 * t.wert / max}%"></div>
      <div class="text">${ausschnitt(t.text, g.begriffe)}</div>
    </div>`).join("") : '<div class="leer">Kein einziges Dokument enthält eines dieser Wörter.</div>';

  let sims = vorlage ? vorlage.sim : null;
  const info = document.getElementById("emb-info");
  if (!sims) {
    info.textContent = "frage lokales Ollama …";
    sims = await liveSims(frage);
  }
  if (!sims) {
    info.textContent = "";
    document.getElementById("emb-liste").innerHTML = '<div class="leer">Für eigene Fragen braucht diese Seite ein laufendes Ollama mit ' + DATEN.modell + ' (localhost:11434). Die vorbereiteten Fragen oben funktionieren immer.</div>';
    return;
  }
  info.textContent = "Kosinus-Ähnlichkeit zur Frage · Top 4 von " + DATEN.abschnitte.length + " Abschnitten · " + DATEN.modell;
  const top = sims.map((s, i) => ({s, i})).sort((a, b) => b.s - a.s).slice(0, 4);
  document.getElementById("emb-liste").innerHTML = top.map(({s, i}) => {
    const a = DATEN.abschnitte[i];
    const zeilen = a.text.split("\n"); const rumpf = zeilen.slice(1).join(" ").replace(/^## /, "");
    return `<div class="treffer ${vorlage && a.datei === vorlage.quelle ? "richtig" : ""}">
      <div class="kopf"><span class="datei">${a.datei}</span><span>${s.toFixed(3)}</span></div>
      <div class="balken" style="width:${Math.max(4, (s - 0.3) / 0.6 * 100)}%"></div>
      <div class="text">${esc(rumpf)}</div></div>`;
  }).join("");
}

async function liveSims(frage) {
  try {
    const r = await fetch("http://localhost:11434/api/embed", {method: "POST", body: JSON.stringify({model: DATEN.modell, input: [frage]})});
    if (!r.ok) return null;
    const q = (await r.json()).embeddings[0];
    if (!window.ABSCHNITT_VEKTOREN) {
      const r2 = await fetch("http://localhost:11434/api/embed", {method: "POST", body: JSON.stringify({model: DATEN.modell, input: DATEN.abschnitte.map(a => a.text)})});
      window.ABSCHNITT_VEKTOREN = (await r2.json()).embeddings;
    }
    const norm = v => Math.sqrt(v.reduce((s, x) => s + x * x, 0));
    const nq = norm(q);
    return window.ABSCHNITT_VEKTOREN.map(v => v.reduce((s, x, i) => s + x * q[i], 0) / (norm(v) * nq));
  } catch (e) { return null; }
}

function knoepfe(ziel, beiKlick) {
  const box = document.getElementById(ziel);
  DATEN.fragen.forEach((f, i) => {
    const b = document.createElement("button");
    b.textContent = f.kurz;
    b.title = f.frage;
    if (f.typ === "umschrieben") b.classList.add("umschrieben");
    if (f.typ === "kennung") b.classList.add("kennung");
    if (f.typ === "fehlt") b.classList.add("fehlt");
    b.addEventListener("click", () => {
      box.querySelectorAll("button").forEach(x => x.classList.remove("aktiv"));
      b.classList.add("aktiv"); beiKlick(f, i);
    });
    box.append(b);
  });
}

const FARBEN = ["#6d28d9","#e65100","#15803d","#0369a1","#be185d","#a16207","#0f766e","#7c2d12","#4338ca","#b91c1c","#065f46"];
const dateien = Object.keys(dokumente);
const farbe = d => `hsl(${Math.round(dateien.indexOf(d) * 137.5) % 360}, 70%, ${dateien.indexOf(d) % 2 ? 38 : 46}%)`;
const X = xy => 40 + xy[0] * 920, Y = xy => 30 + xy[1] * 560;
function karteZeichnen(frage) {
  const svg = document.getElementById("punkte");
  let s = "";
  let top = [];
  if (frage) {
    top = frage.sim.map((v, i) => ({v, i})).sort((a, b) => b.v - a.v).slice(0, 4);
    top.forEach(({i}) => { const a = DATEN.abschnitte[i];
      s += `<line x1="${X(frage.xy)}" y1="${Y(frage.xy)}" x2="${X(a.xy)}" y2="${Y(a.xy)}" stroke="#e65100" stroke-width="2.5" stroke-dasharray="6 4"/>`; });
  }
  DATEN.abschnitte.forEach((a, i) => {
    const t = top.some(x => x.i === i);
    s += `<circle cx="${X(a.xy)}" cy="${Y(a.xy)}" r="${t ? 11 : 8}" fill="${farbe(a.datei)}" fill-opacity="${frage && !t ? 0.35 : 0.85}" stroke="${t ? "#e65100" : "#fff"}" stroke-width="${t ? 3 : 1.5}" data-i="${i}"><title>${esc(a.datei)}</title></circle>`;
  });
  const gesehen = new Set();
  DATEN.abschnitte.forEach(a => { if (gesehen.has(a.datei)) return; gesehen.add(a.datei);
    s += `<text x="${X(a.xy) + 12}" y="${Y(a.xy) - 10}" font-size="15" fill="${farbe(a.datei)}" font-weight="600">${a.datei.replace(".md", "")}</text>`; });
  if (frage) {
    s += `<rect x="${X(frage.xy) - 12}" y="${Y(frage.xy) - 12}" width="24" height="24" rx="4" fill="#e65100" stroke="#fff" stroke-width="2" transform="rotate(45 ${X(frage.xy)} ${Y(frage.xy)})"/>`;
  }
  svg.innerHTML = s;
  svg.querySelectorAll("circle").forEach(c => c.addEventListener("mouseenter", () => zeigeAbschnitt(+c.dataset.i, frage)));
  const info = document.getElementById("karte-info");
  if (frage) {
    info.innerHTML = `<h3>„${esc(frage.frage)}“</h3>` + (frage.quelle ? `<div class="soll">richtig: <b>${frage.quelle}</b></div>` : "") +
      top.map(({v, i}) => `<div class="treffer ${DATEN.abschnitte[i].datei === frage.quelle ? "richtig" : ""}"><div class="kopf"><span class="datei">${DATEN.abschnitte[i].datei}</span><span>${v.toFixed(3)}</span></div></div>`).join("") +
      `<p class="legende" style="margin-top:6px">Gestrichelt: die vier ähnlichsten Abschnitte im echten Raum mit 768 Dimensionen. Die Karte drückt diesen Raum auf zwei Dimensionen zusammen (t-SNE), Abstände auf der Karte stimmen deshalb nur ungefähr.</p>`;
  } else {
    info.innerHTML = `<h3>Jeder Punkt ist ein Abschnitt</h3><p>Abschnitte mit ähnlicher Bedeutung liegen nah beieinander, auch wenn sie keine Wörter teilen. Fahrt mit der Maus über einen Punkt. Wählt oben eine Frage: Sie landet als Raute in der Nachbarschaft ihrer Antwort, hoffentlich.</p><p class="legende" style="margin-top:6px">${DATEN.abschnitte.length} Abschnitte aus ${dateien.length} Dateien · ${DATEN.modell} · 768 Dimensionen, für die Karte auf zwei zusammengedrückt (t-SNE)</p>`;
  }
}
function zeigeAbschnitt(i, frage) {

// ---------------- Chunking ----------------
const ROH = "# Rücktritt aus gesundheitlichen Gründen\n\n## Wann gilt das?\nWer an einem Prüfungstag aus gesundheitlichen Gründen nicht antreten kann\noder eine Prüfung deshalb abbricht, gilt als prüfungsunfähig. Die Prüfung\nwird dann nicht als Fehlversuch gewertet, wenn der Grund rechtzeitig\nnachgewiesen wird.\n\n## Nachweis\nNötig ist ein ärztliches Attest, das die Prüfungsunfähigkeit am Prüfungstag\nbestätigt. Eine einfache Arbeitsunfähigkeitsbescheinigung reicht nicht.\nDas Attest muss innerhalb von drei Werktagen nach dem Prüfungstermin beim\nPrüfungsamt eingehen, zusammen mit dem Formular PA-07\n„Antrag auf Anerkennung der Prüfungsunfähigkeit“.\n\n## Danach\nIhr werdet automatisch zum nächsten regulären Termin angemeldet.\n";
const FAKT = "Das Attest muss innerhalb von drei Werktagen nach dem Prüfungstermin";
let nachUeberschrift = false;
function zerlegen(text, groesse, overlap) {
  if (nachUeberschrift) {
    const teile = []; let start = 0;
    const re = /\n(?=## )/g; let m;
    while ((m = re.exec(text))) { teile.push([start, m.index]); start = m.index + 1; }
    teile.push([start, text.length]); return teile;
  }
  const teile = []; let start = 0;
  while (start < text.length) { const ende = Math.min(text.length, start + groesse); teile.push([start, ende]); if (ende === text.length) break; start = ende - overlap; }
  return teile;
}
function chunkingZeichnen() {
  const g = +document.getElementById("groesse").value, o = Math.min(+document.getElementById("overlap").value, g - 10);
  document.getElementById("groesse-w").textContent = g; document.getElementById("overlap-w").textContent = o;
  document.getElementById("nach-ueberschrift").classList.toggle("aktiv", nachUeberschrift);
  const teile = zerlegen(ROH, g, o);
  // pro Zeichen: welcher Chunk (erster), Überlappung?
  const zu = new Array(ROH.length).fill(-1), anzahl = new Array(ROH.length).fill(0);
  teile.forEach(([a, b], k) => { for (let i = a; i < b; i++) { if (zu[i] < 0) zu[i] = k; anzahl[i]++; } });
  const fa = ROH.indexOf(FAKT), fb = fa + FAKT.length;
  let html = "", i = 0;
  while (i < ROH.length) {
    let j = i; while (j < ROH.length && zu[j] === zu[i] && (anzahl[j] > 1) === (anzahl[i] > 1) && (j >= fa && j < fb) === (i >= fa && i < fb)) j++;
    const cls = "ch ch" + (zu[i] % 5) + (anzahl[i] > 1 ? " ueberlapp" : "") + (i >= fa && i < fb ? " fakt" : "");
    html += `<span class="${cls}">${esc(ROH.slice(i, j))}</span>`; i = j;
  }
  document.getElementById("chunks").innerHTML = html;
  const ganz = teile.some(([a, b]) => a <= fa && b >= fb);
  const st = document.getElementById("chunk-status");
  st.className = "status " + (ganz ? "gut" : "schlecht");
  st.innerHTML = `<b>${teile.length} Abschnitte.</b> ` + (ganz ? "Der Satz mit der Frist steht vollständig in einem Abschnitt." :
    "Der Satz mit der Frist ist zerschnitten. Kein Abschnitt enthält ihn ganz: Ein Abschnitt kennt die Frist, ein anderer, wofür sie gilt.");
}
